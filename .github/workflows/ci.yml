# Every check the repo has, on every push and PR.
#
# The build runs here on purpose: it is the one check too heavy for the
# development machine, and CI is where it is affordable.
#
# Steps after lint run whenever the install succeeded, so a red lint still
# reports typecheck, test and build rather than masking them — the job is red
# either way. A failed `npm ci` skips them instead: without node_modules all
# three fail for the same reason, and three failures for one broken thing
# trains people to skim past red.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step here reads; `npm ci` runs dependency lifecycle scripts, so the
# token they see is scoped down to what checkout needs.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: the lockfile is authoritative.
      - id: install
        run: npm ci

      - run: npm run lint

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
